name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-research.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-research.txt
      - run: python -m unittest discover -s tests
      - run: node --test tests/*.test.mjs
      - name: Generated source inventory is current
        run: |
          python scripts/build_sources.py
          git diff --exit-code -- worker/research-sources.mjs
