name: Refresh verified xG data

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/xg-data-refresh.yml'
      - 'research/xg_refresh.py'
      - 'scripts/publish_xg_data.py'
  schedule:
    - cron: '41 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xg-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-research.txt
      - run: python -m pip install -r requirements-research.txt
      - name: Restore the last verified xG snapshot
        run: python -m scripts.publish_xg_data restore --state-dir artifacts/xg-data
      - name: Refresh known sources and current reference results
        run: |
          python -m research.xg_refresh \
            --state-dir artifacts/xg-data \
            --seed docs/research/xg-2026-11-06/xg-matches.json \
            --data-dir artifacts/reference-results \
            --refresh-reference
      - name: Publish the attempt and retain accepted data separately
        if: always() && hashFiles('artifacts/xg-data/report.json') != ''
        run: |
          python -m scripts.publish_xg_data publish \
            --output artifacts/xg-data \
            --repository '${{ github.repository }}' \
            --run-id '${{ github.run_id }}' \
            --run-attempt '${{ github.run_attempt }}' \
            --commit '${{ github.sha }}'
      - name: Show match-data freshness
        if: always() && hashFiles('artifacts/xg-data/report.md') != ''
        run: cat artifacts/xg-data/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Retain refresh diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xg-data-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/xg-data/
          retention-days: 90
          if-no-files-found: warn
      - name: Fail visibly if the refresh could not be verified
        if: always() && hashFiles('artifacts/xg-data/report.json') != ''
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('artifacts/xg-data/report.json').read_text())
          if report['status'] == 'failed':
              raise SystemExit('Refresh failed; inspect the published attempt. Accepted data were retained.')
          PY
